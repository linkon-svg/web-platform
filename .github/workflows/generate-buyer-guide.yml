name: Generate Buyer Guide PDF

on:
  push:
    branches:
      - chatgpt-pdf-build-20260923
    paths:
      - 'tmp_pdf_build/**'
      - '.github/workflows/generate-buyer-guide.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-pdf-build-20260923

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install weasyprint pillow requests beautifulsoup4 qrcode

      - name: Build PDF
        run: python tmp_pdf_build/generate_buyer_guide.py

      - name: Publish PDF to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp_pdf_output/2026_Tokyo_KFashion_Buyer_Guide.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Add generated Japanese buyer guide PDF"
            git push origin HEAD:chatgpt-pdf-build-20260923
          fi

      - name: Publish PDF as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="buyer-guide-20260923"
          PDF="tmp_pdf_output/2026_Tokyo_KFashion_Buyer_Guide.pdf"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "2026 Tokyo K-Fashion Buyer Guide" --notes "Japanese buyer invitation and participating brand guide."
          fi
          gh release upload "$TAG" "$PDF" --clobber

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2026-Tokyo-KFashion-Buyer-Guide
          path: tmp_pdf_output/2026_Tokyo_KFashion_Buyer_Guide.pdf
          if-no-files-found: error
          retention-days: 7

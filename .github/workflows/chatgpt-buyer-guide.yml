name: Build Tokyo K-Fashion Buyer Guide

on:
  push:
    branches:
      - chatgpt-buyer-guide-pdf
    paths:
      - tools/generate_buyer_guide.py
      - .github/workflows/chatgpt-buyer-guide.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: chatgpt-buyer-guide-pdf

      - name: Install system fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests beautifulsoup4 qrcode

      - name: Generate buyer guide PDF
        run: python tools/generate_buyer_guide.py

      - name: Validate PDF
        run: |
          pdfinfo generated/2026_Tokyo_KFashion_Buyer_Brand_Guide.pdf
          test "$(pdfinfo generated/2026_Tokyo_KFashion_Buyer_Brand_Guide.pdf | awk '/Pages:/ {print $2}')" = "13"

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: Tokyo-KFashion-Buyer-Guide
          path: |
            generated/2026_Tokyo_KFashion_Buyer_Brand_Guide.pdf
            generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_preview.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated files to temporary branch
        run: |
          git config user.name "chatgpt-artifact-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/2026_Tokyo_KFashion_Buyer_Brand_Guide.pdf generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_preview.png
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Generate Tokyo K-Fashion buyer guide PDF"
            git push origin HEAD:chatgpt-buyer-guide-pdf
          fi

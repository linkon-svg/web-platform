name: Build buyer guide PDF

on:
  push:
    branches:
      - chatgpt-pdf-build-20260923
    paths:
      - 'tmp_pdf_build/**'
      - '.github/workflows/build-buyer-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts and PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow qrcode weasyprint pypdf

      - name: Generate PDF
        run: |
          python tmp_pdf_build/generate_buyer_guide.py
          ls -lh tmp_pdf_output

      - name: Validate PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          p = Path('tmp_pdf_output/2026_Tokyo_KFashion_Buyer_Guide.pdf')
          assert p.exists() and p.stat().st_size > 100_000, p
          r = PdfReader(str(p))
          assert len(r.pages) == 13, len(r.pages)
          print('Validated pages:', len(r.pages), 'size:', p.stat().st_size)
          PY

      - name: Upload generated PDF
        uses: actions/upload-artifact@v4
        with:
          name: 2026-Tokyo-KFashion-Buyer-Guide
          path: tmp_pdf_output/2026_Tokyo_KFashion_Buyer_Guide.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated PDF to temporary branch
        run: |
          git config user.name 'chatgpt-artifact-builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tmp_pdf_output/2026_Tokyo_KFashion_Buyer_Guide.pdf
          if git diff --cached --quiet; then
            echo 'No PDF changes to commit.'
          else
            git commit -m 'Build Tokyo K-Fashion buyer guide PDF [skip ci]'
            git push origin HEAD:chatgpt-pdf-build-20260923
          fi

name: Publish Buyer Guide Release

on:
  push:
    branches:
      - chatgpt-pdf-build-20260923
    paths:
      - '.github/workflows/publish-buyer-guide-release.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-pdf-build-20260923

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="buyer-guide-20260923"
          PDF="tmp_pdf_output/2026_Tokyo_KFashion_Buyer_Guide.pdf"
          test -f "$PDF"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "2026 Tokyo K-Fashion Buyer Guide" --notes "Japanese buyer invitation and participating brand guide."
          fi
          gh release upload "$TAG" "$PDF" --clobber

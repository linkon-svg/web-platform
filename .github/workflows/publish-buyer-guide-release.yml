name: Publish Buyer Guide Release

on:
  push:
    branches:
      - chatgpt-pdf-build-20260923
    paths:
      - '.github/workflows/publish-buyer-guide-release.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-pdf-build-20260923

      - name: Upload PDF to qurl
        run: |
          PDF="tmp_pdf_output/2026_Tokyo_KFashion_Buyer_Guide.pdf"
          test -f "$PDF"
          RESPONSE=$(curl --fail --show-error --silent \
            -T "${PDF}" \
            -H "X-TTL: 7d" \
            -H "X-Downloads: 100" \
            https://qurl.sh)
          echo "${RESPONSE}"
          URL=$(printf '%s\n' "${RESPONSE}" | grep -Eo 'https://qurl\.sh/[A-Za-z0-9_-]+/[^[:space:]]+\.pdf' | head -n 1)
          case "${URL}" in
            https://qurl.sh/*) ;;
            *) echo "Unexpected upload response: ${RESPONSE}" >&2; exit 1 ;;
          esac
          echo "${URL}" > tmp_pdf_output/PUBLIC_URL.txt

      - name: Save public URL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp_pdf_output/PUBLIC_URL.txt
          git commit -m "Update buyer guide qurl download URL"
          git push origin HEAD:chatgpt-pdf-build-20260923

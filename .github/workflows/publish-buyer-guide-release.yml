name: Publish Buyer Guide Release

on:
  push:
    branches:
      - chatgpt-pdf-build-20260923
    paths:
      - '.github/workflows/publish-buyer-guide-release.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-pdf-build-20260923

      - name: Create short download URL
        run: |
          SOURCE_URL="https://github.com/linkon-svg/web-platform/releases/download/buyer-guide-20260923/2026_Tokyo_KFashion_Buyer_Guide.pdf"
          SHORT_URL=$(curl --fail --show-error --silent --get \
            --data-urlencode "url=${SOURCE_URL}" \
            "https://tinyurl.com/api-create.php")
          echo "${SHORT_URL}"
          case "${SHORT_URL}" in
            https://tinyurl.com/*) ;;
            *) echo "Unexpected short URL: ${SHORT_URL}" >&2; exit 1 ;;
          esac
          echo "${SHORT_URL}" > tmp_pdf_output/PUBLIC_URL.txt

      - name: Save short URL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp_pdf_output/PUBLIC_URL.txt
          git commit -m "Update buyer guide short download URL"
          git push origin HEAD:chatgpt-pdf-build-20260923

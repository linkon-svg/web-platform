name: Build Tokyo K-Fashion Buyer Guide

on:
  push:
    branches:
      - chatgpt-buyer-guide-pdf
    paths:
      - tools/generate_buyer_guide.py
      - tools/generate_buyer_guide_v2.py
      - .github/workflows/chatgpt-buyer-guide.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: chatgpt-buyer-guide-pdf

      - name: Install system fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests beautifulsoup4 qrcode instaloader selenium

      - name: Apply runner safeguards and speed limits
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('tools/generate_buyer_guide.py')
          base_text = base.read_text(encoding='utf-8')
          base_text = base_text.replace(
              '"url": "https://www.sticokorea.com/kr/portfolio-styles/", "display": "www.sticokorea.com",',
              '"url": "https://sticoeu.com/Products", "display": "www.sticokorea.com",',
          )
          base.write_text(base_text, encoding='utf-8')

          path = Path('tools/generate_buyer_guide_v2.py')
          text = path.read_text(encoding='utf-8')
          marker = 'import generate_buyer_guide as g\n'
          if 'ORIGINAL_INSTAGRAM_COLLECTOR' not in text:
              text = text.replace(marker, marker + '\nORIGINAL_INSTAGRAM_COLLECTOR = g.collect_instagram_images\ng.SESSION.verify = False\n', 1)
          text = text.replace('return g.collect_instagram_images(brand, count)', 'return ORIGINAL_INSTAGRAM_COLLECTOR(brand, count)')
          text = text.replace(
              'options.add_argument("--headless=new")',
              'options.add_argument("--headless=new")\n    options.add_argument("--ignore-certificate-errors")\n    options.add_argument("--allow-insecure-localhost")\n    options.set_capability("acceptInsecureCerts", True)',
              1,
          )
          text = text.replace('_DRIVER.set_page_load_timeout(45)', '_DRIVER.set_page_load_timeout(24)')
          text = text.replace('time.sleep(3.5)', 'time.sleep(1.3)')
          text = text.replace('for fraction in (0.2, 0.45, 0.7, 1.0):', 'for fraction in (0.35, 0.75, 1.0):')
          text = text.replace('time.sleep(0.9)', 'time.sleep(0.35)')
          text = text.replace('if len(selected) < count:', 'if len(selected) < min(count, 3):', 1)
          text = text.replace('for product_page in links[:4]:', 'for product_page in links[:1]:')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Generate buyer guide PDF
        env:
          PYTHONWARNINGS: "ignore:Unverified HTTPS request"
        run: python tools/generate_buyer_guide_v2.py

      - name: Validate PDF and image sources
        run: |
          pdfinfo generated/2026_Tokyo_KFashion_Buyer_Brand_Guide.pdf
          test "$(pdfinfo generated/2026_Tokyo_KFashion_Buyer_Brand_Guide.pdf | awk '/Pages:/ {print $2}')" = "13"
          test -s generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_contact_sheet.jpg
          test -s generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_image_sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_image_sources.json').read_text(encoding='utf-8'))
          for brand, images in data['brands'].items():
              assert len(images) >= 6, (brand, len(images))
              assert all(item.get('width', 0) > 0 and item.get('height', 0) > 0 for item in images[:6])
          evid = data['brands']['EVID'][:6]
          assert all('instagram' in item.get('origin', '').lower() for item in evid), evid
          print('Image source validation passed')
          PY

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: Tokyo-KFashion-Buyer-Guide
          path: |
            generated/2026_Tokyo_KFashion_Buyer_Brand_Guide.pdf
            generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_preview.png
            generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_contact_sheet.jpg
            generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_image_sources.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated files to temporary branch
        run: |
          git config user.name "chatgpt-artifact-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            generated/2026_Tokyo_KFashion_Buyer_Brand_Guide.pdf \
            generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_preview.png \
            generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_contact_sheet.jpg \
            generated/2026_Tokyo_KFashion_Buyer_Brand_Guide_image_sources.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Regenerate buyer guide with uncropped product photos"
            git push origin HEAD:chatgpt-buyer-guide-pdf
          fi
